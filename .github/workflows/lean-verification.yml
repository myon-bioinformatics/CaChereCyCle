name: Lean verification

on:
  pull_request:
    paths:
      - "formal/**"
      - "cacherecycle.py"
      - "tests/test_formal_ownership_bridge.py"
      - ".github/workflows/lean-verification.yml"
  push:
    branches: [main]
    paths:
      - "formal/**"
      - "cacherecycle.py"
      - "tests/test_formal_ownership_bridge.py"
      - ".github/workflows/lean-verification.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lean-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  manifest-ownership:
    uses: myon-bioinformatics/myon-bioinformatics/.github/workflows/reusable-lean-verify.yml@27c46411c0a07d9b4d0f1ad5751ed1bb9e869b5c
    with:
      project-directory: formal
      proof: Ownership.lean
      theorems: |
        CaChereCyCle.prune_exact
        CaChereCyCle.ownership_reset
